; OpenDDS configuration for interop/run.sh: RTPS discovery (SPDP/SEDP)
; and the RTPS_UDP transport, as DDSI-RTPS 2.x specifies them.
[common]
DCPSGlobalTransportConfig=$file
DCPSDefaultDiscovery=DEFAULT_RTPS

[transport/rtps]
transport_type=rtps_udp
; Socket buffers of 4 MiB: with the default, most fragments of the
; samples of the -large cases are lost on the way in. The system's limit
; (net.core.rmem_max on Linux) has to allow it.
rcv_buffer_size=4194304
send_buffer_size=4194304
