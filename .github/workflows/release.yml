name: Release

# Builds the Rust crates and the Python package rustorb-dds (python/) and
# publishes them (docs/release.md).
#
# - a tag v0.2.0 (the version of tools/set-version.py --check): packages
#   the crates and builds them against each other as packaged, builds one
#   abi3 wheel (CPython 3.9 or later) per platform and the sdist, attaches
#   them to a draft GitHub Release, publishes the crates to crates.io (in
#   the `crates-io` environment, with the CARGO_REGISTRY_TOKEN secret) and
#   the Python package to PyPI (in the `pypi` environment, with a PyPI
#   trusted publisher or the PYPI_API_TOKEN secret), and then publishes the
#   GitHub Release. The environments' protection rules can require an
#   approval. Run again after a failure, it skips what is already
#   published.
# - Run workflow (workflow_dispatch), or a pull request that changes the
#   packaging: only builds and checks, the artifacts stay on the run.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - tools/set-version.py
      - python/pyproject.toml
      - "crates/*/Cargo.toml"
      - Cargo.toml
      - "tools/release-check/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Check that every package has the version of the tag
        shell: bash
        run: |
          version=$(python3 tools/set-version.py --check)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME, but the packages are at $version"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag ]] && ! grep -q "^## \[$version\] - [0-9]" CHANGELOG.md; then
            echo "::error::no dated CHANGELOG.md entry for $version"
            exit 1
          fi

  crates:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Packages and builds each crate against the others as packaged, in
      # the order of their dependencies.
      - run: cargo publish --workspace --dry-run --locked --exclude rustorb-dds-python
      - run: cargo package --workspace --locked --no-verify --exclude rustorb-dds-python
      - uses: actions/upload-artifact@v4
        with:
          name: crates
          path: target/package/*.crate

  wheels:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out ../dist
      - name: Install the wheel and run the tests with it
        shell: bash
        # The x86_64 wheel built on an arm64 Mac cannot be loaded there.
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          python -m pip install dist/*.whl pytest
          cd "$RUNNER_TEMP" && python -I -m pytest -q "$GITHUB_WORKSPACE/python/tests"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out ../dist
      - name: Build a wheel from the sdist
        run: python -m pip wheel --no-deps dist/*.tar.gz -w "$RUNNER_TEMP/wheel"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # librustorb_dds_ffi, the C ABI (docs/c-abi.md), per platform: the
  # shared library with rustorb/dds.h, and the static one but on Windows,
  # in rustorb-dds-native-<version>-<platform> (a .tar.gz, a .zip on
  # Windows). The NuGet package Rustorb.Dds takes the shared libraries, the
  # gem the static ones; the Java binding can load the shared one. Linux
  # builds in the manylinux 2.28 images, so that glibc 2.28 is enough, like
  # the wheels.
  native:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux-x86_64, container: "quay.io/pypa/manylinux_2_28_x86_64" }
          - { os: ubuntu-24.04-arm, name: linux-aarch64, container: "quay.io/pypa/manylinux_2_28_aarch64" }
          - { os: macos-latest, name: macos-aarch64, target: aarch64-apple-darwin }
          - { os: macos-latest, name: macos-x86_64, target: x86_64-apple-darwin }
          - { os: windows-latest, name: windows-x86_64, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      ARCHIVE: rustorb-dds-native-${{ needs.version.outputs.version }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (manylinux)
        if: matrix.container
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.container }}
        with:
          targets: ${{ matrix.target }}
      - name: Build librustorb_dds_ffi
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --locked -p rustorb-dds-ffi --target "${{ matrix.target }}"
            echo "OUT=target/${{ matrix.target }}/release" >> "$GITHUB_ENV"
          else
            cargo build --release --locked -p rustorb-dds-ffi
            echo "OUT=target/release" >> "$GITHUB_ENV"
          fi
      - name: Put the libraries, the header and the licenses together
        shell: bash
        run: |
          d="dist/$ARCHIVE"
          mkdir -p "$d/include/rustorb" "$d/lib"
          cp crates/rustorb-dds-ffi/include/rustorb/dds.h "$d/include/rustorb/"
          cp LICENSE-MIT LICENSE-APACHE "$d/"
          case "$RUNNER_OS" in
            Linux) cp "$OUT/librustorb_dds_ffi.so" "$OUT/librustorb_dds_ffi.a" "$d/lib/" ;;
            macOS) cp "$OUT/librustorb_dds_ffi.dylib" "$OUT/librustorb_dds_ffi.a" "$d/lib/" ;;
            Windows)
              mkdir -p "$d/bin"
              cp "$OUT/rustorb_dds_ffi.dll" "$d/bin/"
              cp "$OUT/rustorb_dds_ffi.dll.lib" "$d/lib/" ;;
          esac
          find "$d" -type f
      - name: Check the exported symbols (rdds_ only) and the glibc it needs
        if: runner.os == 'Linux'
        run: |
          lib="dist/$ARCHIVE/lib/librustorb_dds_ffi.so"
          others=$(nm -D --defined-only "$lib" | awk '{print $3}' | grep -v '^rdds_' || true)
          if [ -n "$others" ]; then echo "::error::exported: $others"; exit 1; fi
          objdump -T "$lib" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1
      - name: Check the exported symbols and the install name
        if: runner.os == 'macOS'
        run: |
          lib="dist/$ARCHIVE/lib/librustorb_dds_ffi.dylib"
          others=$(nm -gU "$lib" | awk '{print $3}' | grep -v '^_rdds_' || true)
          if [ -n "$others" ]; then echo "::error::exported: $others"; exit 1; fi
          otool -D "$lib"
          otool -D "$lib" | grep -q '@rpath/librustorb_dds_ffi.dylib'
      - name: Build and run a program against the archive (shared and static)
        # the x86_64 library built on an arm64 Mac does not run there
        if: runner.os != 'Windows' && matrix.name != 'macos-x86_64'
        shell: bash
        run: |
          d="$PWD/dist/$ARCHIVE"
          libs=(-lpthread -ldl -lm)
          if [[ "$RUNNER_OS" == macOS ]]; then
            libs=(-framework CoreFoundation -framework Security -framework SystemConfiguration -lpthread -lm)
          fi
          cc -std=c99 -Wall -Wextra -Werror -I"$d/include" tools/release-check/abi.c \
            -L"$d/lib" -lrustorb_dds_ffi -Wl,-rpath,"$d/lib" -o abi-shared
          ./abi-shared
          cc -std=c99 -Wall -Wextra -Werror -I"$d/include" tools/release-check/abi.c \
            "$d/lib/librustorb_dds_ffi.a" "${libs[@]}" -o abi-static
          ./abi-static
      # MSVC is not on the PATH of a plain shell: CMake finds it.
      - name: Build and run a program against the archive (MSVC)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -S tools/release-check -B build/check "-DRDDS_PREFIX=$PWD/dist/$ARCHIVE"
          cmake --build build/check --config Release
          PATH="$PWD/dist/$ARCHIVE/bin:$PATH" build/check/Release/abi.exe
      - name: Archive
        shell: bash
        run: |
          cd dist
          if [[ "$RUNNER_OS" == Windows ]]; then 7z a "$ARCHIVE.zip" "$ARCHIVE"; else tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.name }}
          path: |
            dist/${{ env.ARCHIVE }}.tar.gz
            dist/${{ env.ARCHIVE }}.zip
          if-no-files-found: error

  # Also runs without a tag, to check the notes and SHA256SUMS
  draft:
    needs: [version, crates, wheels, sdist, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '/^## \[/{p = index($0, "## [" v "]") == 1; next} p' CHANGELOG.md > notes.md
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then test -s notes.md; fi
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Create or update the draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --draft --verify-tag --title "rustorb-dds $TAG" --notes-file notes.md
          fi

  crates-io:
    if: github.ref_type == 'tag'
    needs: [version, draft]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish the crates, those not yet on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # In the order of their dependencies.
          for c in rustorb-dds-security rustorb-xtypes rustorb-rtps rustorb-dds rustorb-dds-corba rustorb-dds-ffi; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -A "rustorb-dds release workflow" \
              "https://crates.io/api/v1/crates/$c/$VERSION")
            if [[ "$code" == 200 ]]; then
              echo "$c $VERSION is on crates.io already"
              continue
            fi
            cargo publish -p "$c" --locked
          done

  pypi:
    if: github.ref_type == 'tag'
    needs: [version, draft]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      # The wheels and the sdist, not the crates.
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      # Trusted publishing (OpenID Connect) when PYPI_API_TOKEN is not set.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  publish-release:
    if: github.ref_type == 'tag'
    needs: [crates-io, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
