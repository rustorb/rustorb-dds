name: Release

# Builds the Python package rustorb-dds (python/) and publishes it to PyPI
# (docs/release.md).
#
# - a tag python-v0.1.0 (the version of python/pyproject.toml): builds one
#   abi3 wheel (CPython 3.9 or later) per platform and the sdist, attaches
#   them to a draft GitHub Release, publishes them to PyPI, and then
#   publishes the GitHub Release. The PyPI upload runs in the `pypi`
#   environment (its protection rules can require an approval) with a PyPI
#   trusted publisher, or the PYPI_API_TOKEN secret. Run again after a
#   failure, it skips what is already published.
# - Run workflow (workflow_dispatch), or a pull request that changes the
#   packaging: only builds and checks, the artifacts stay on the run.
#
# The Rust crates are not published yet.

on:
  push:
    tags: ["python-v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - python/pyproject.toml
      - "crates/*/Cargo.toml"
      - Cargo.toml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Check that the package has the version of the tag
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')
          init=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' python/rustorb_dds/__init__.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$init" != "$version" ]]; then
            echo "::error::rustorb_dds.__version__ is $init, pyproject.toml says $version"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "python-v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME, but the package is at $version"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag ]] && ! grep -q "^## \[python-$version\]" CHANGELOG.md; then
            echo "::error::no CHANGELOG.md entry for python-$version"
            exit 1
          fi

  wheels:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out ../dist
      - name: Install the wheel and run the tests with it
        shell: bash
        # The x86_64 wheel built on an arm64 Mac cannot be loaded there.
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          python -m pip install dist/*.whl pytest
          cd "$RUNNER_TEMP" && python -I -m pytest -q "$GITHUB_WORKSPACE/python/tests"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out ../dist
      - name: Build a wheel from the sdist
        run: python -m pip wheel --no-deps dist/*.tar.gz -w "$RUNNER_TEMP/wheel"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Also runs without a tag, to check the notes and SHA256SUMS
  draft:
    needs: [version, wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: python-${{ needs.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '/^## \[/{p = index($0, "## [" v "]") == 1; next} p' CHANGELOG.md > notes.md
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then test -s notes.md; fi
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Create or update the draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --draft --verify-tag --title "rustorb-dds (Python) $TAG" --notes-file notes.md
          fi

  pypi:
    if: github.ref_type == 'tag'
    needs: [version, draft]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Trusted publishing (OpenID Connect) when PYPI_API_TOKEN is not set.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  publish-release:
    if: github.ref_type == 'tag'
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
