name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  doc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked

  # Hello world with Cyclone DDS and Fast DDS, both ways (interop/run.sh).
  # The peers come from the Ubuntu 24.04 packages; see interop/README.md.
  interop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the peers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ tcpdump \
            cyclonedds-dev cyclonedds-tools libfastrtps-dev fastddsgen
      - run: interop/run.sh
      - name: Keep the logs, versions and captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop
          path: |
            target/interop
            !target/interop/build
          if-no-files-found: ignore

  # ROS 2's demo talker and listener with rmw_fastrtps_cpp and
  # rmw_cyclonedds_cpp, both ways (interop/ros2.sh). ROS 2 Jazzy comes
  # from the ROS 2 packages for Ubuntu 24.04; see interop/README.md.
  ros2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ROS 2 Jazzy
        run: |
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo "$UBUNTU_CODENAME") main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq ros-jazzy-demo-nodes-cpp \
            ros-jazzy-rmw-fastrtps-cpp ros-jazzy-rmw-cyclonedds-cpp
      - name: interop/ros2.sh
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          interop/ros2.sh
      - name: Keep the logs and versions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-ros2
          path: target/interop-ros2
          if-no-files-found: ignore
