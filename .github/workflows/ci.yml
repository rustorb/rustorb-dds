name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  doc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked

  # The C ABI from C and C++ (crates/rustorb-dds-ffi/tests/c).
  c-abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: crates/rustorb-dds-ffi/tests/c/run.sh

  # The C++ binding: its CMake project, tests and examples (cpp/).
  cpp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cmake -S cpp -B target/cpp -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build target/cpp --config Release
      - run: ctest --test-dir target/cpp --build-config Release --output-on-failure

  # The Java binding: its Maven project, tests and examples (java/), and
  # Ffi.java up to date with rustorb/dds.h.
  java:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
          cache: maven
      - run: python3 java/tools/gen-ffi.py --check
        if: runner.os == 'Linux'
      - run: mvn -B -ntp -f java/pom.xml verify

  # The Python binding (python/): built with maturin, tested with pytest.
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ./python pytest
      - run: pytest python/tests

  # Hello world with Cyclone DDS and Fast DDS, both ways (interop/run.sh).
  # The peers come from the Ubuntu 24.04 packages; see interop/README.md.
  interop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
          cache: maven
      - name: Install the peers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ tcpdump \
            cyclonedds-dev cyclonedds-tools libfastrtps-dev fastddsgen
      - name: Install the Python binding
        run: pip install ./python
      - run: interop/run.sh
        env:
          PYTHON: python
      - name: Keep the logs, versions and captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop
          path: |
            target/interop
            !target/interop/build
          if-no-files-found: ignore

  # ROS 2's demo talker and listener with rmw_fastrtps_cpp and
  # rmw_cyclonedds_cpp, both ways (interop/ros2.sh). ROS 2 Jazzy comes
  # from the ROS 2 packages for Ubuntu 24.04; see interop/README.md.
  ros2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ROS 2 Jazzy
        run: |
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo "$UBUNTU_CODENAME") main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq ros-jazzy-demo-nodes-cpp \
            ros-jazzy-rmw-fastrtps-cpp ros-jazzy-rmw-cyclonedds-cpp
      - name: interop/ros2.sh
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          # A capture of the cases, kept with the logs, to see what each
          # middleware puts on the wire.
          mkdir -p target/interop-ros2
          sudo tcpdump -i lo -U -Z root -w target/interop-ros2/ros2.pcap udp >/dev/null 2>&1 &
          interop/ros2.sh
      - name: Stop the capture
        if: always()
        run: sudo pkill tcpdump || true
      - name: Show the user DATA of the service cases
        if: failure()
        run: |
          sudo chmod a+r target/interop-ros2/ros2.pcap || true
          python3 interop/rtps_dump.py target/interop-ros2/ros2.pcap 113 114 117 118 --max 3 || true
          python3 interop/rtps_dump.py target/interop-ros2/ros2.pcap 117 118 --trace || true
      - name: Keep the logs and versions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-ros2
          path: target/interop-ros2
          if-no-files-found: ignore

  # OpenRTM-aist 2.0's ConsoleIn and ConsoleOut over its Fast DDS
  # transport, with the openrtm examples in Rust, C++ and Python, both ways
  # (interop/openrtm.sh). OpenRTM-aist 2.0.2 is built from its release tag
  # in OpenRTM's development image for Ubuntu 22.04 (omniORB and ROS 2
  # Humble's Fast DDS 2.6; 2.0.2 does not build with Fast CDR 2). The
  # Python cases use the types rustorb-idl generates from OpenRTM-aist's
  # BasicDataType.idl.
  openrtm:
    runs-on: ubuntu-24.04
    container: openrtm/devel-rtm:ubuntu22.04
    env:
      OPENRTM_VERSION: v2.0.2
    steps:
      - name: Install tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git curl python3-pip python3-venv pkg-config tcpdump tshark >/dev/null
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build OpenRTM-aist with FastRTPSTransport
        shell: bash
        run: |
          git clone --depth 1 --branch "$OPENRTM_VERSION" https://github.com/OpenRTM/OpenRTM-aist.git /tmp/rtm
          source /opt/ros/humble/setup.bash
          # RelWithDebInfo: the Release configuration adds -Werror.
          cmake -DFASTRTPS_ENABLE=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -S /tmp/rtm -B /tmp/rtm/build >/tmp/rtm-cmake.log
          cmake --build /tmp/rtm/build -j "$(nproc)" >/tmp/rtm-build.log 2>&1 || { tail -n 80 /tmp/rtm-build.log; exit 1; }
          cmake --install /tmp/rtm/build >/dev/null
          ldconfig
      - name: Build the examples
        shell: bash
        run: |
          cargo build --locked --example openrtm
          cmake -S cpp -B target/cpp -DCMAKE_BUILD_TYPE=Debug
          cmake --build target/cpp --target openrtm -j "$(nproc)"
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q ./python "git+https://github.com/rustorb/rustorb-idl#subdirectory=python"
          mkdir -p target/openrtm-types
          /tmp/venv/bin/rustorb-idl -bpython -Wbdds_only -Wbextensibility=final \
            -C target/openrtm-types /tmp/rtm/src/lib/rtm/idl/BasicDataType.idl
      - name: interop/openrtm.sh
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          CAPTURE=1 RUST=target/debug/examples/openrtm CPP=target/cpp/openrtm PYTHON=/tmp/venv/bin/python \
            PYTHONPATH="$PWD/target/openrtm-types" interop/openrtm.sh
      - name: Keep the logs and versions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-openrtm
          path: target/interop-openrtm
          if-no-files-found: ignore
