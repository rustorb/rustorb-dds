[workspace]
resolver = "3"
members = [
    "crates/rustorb-xtypes",
    "crates/rustorb-rtps",
    "crates/rustorb-dds",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rustorb/rustorb-dds"
homepage = "https://github.com/rustorb/rustorb-dds"
keywords = ["dds", "rtps", "ddsi", "pubsub", "ros2"]
categories = ["network-programming"]

[workspace.dependencies]
rustorb-xtypes = { path = "crates/rustorb-xtypes" }
rustorb-rtps = { path = "crates/rustorb-rtps" }
# Socket options std lacks (SO_REUSEADDR before bind, IP_MULTICAST_IF).
# MIT OR Apache-2.0.
socket2 = { version = "0.6", features = ["all"] }
# The shared parts of rustorb, released in 0.2.0 (rustorb/rustorb#114).
# Both are MIT OR Apache-2.0; the GPL generator is never a dependency.
rustorb-cdr = "0.2.0"
rustorb-typesupport = "0.2.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
