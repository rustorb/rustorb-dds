; OpenDDS configuration for bench/opendds/perf: RTPS discovery
; (SPDP/SEDP) and the RTPS_UDP transport, as interop/opendds/rtps.ini.
[common]
DCPSGlobalTransportConfig=$file
DCPSDefaultDiscovery=DEFAULT_RTPS

[transport/rtps]
transport_type=rtps_udp
; Socket buffers of 4 MiB (the system's limit, net.core.rmem_max on
; Linux, has to allow it), as interop/opendds/rtps.ini.
rcv_buffer_size=4194304
send_buffer_size=4194304
