[package]
name = "rustorb-dds"
description = "DDS (Data Distribution Service) DCPS API in Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
rustorb-rtps.workspace = true
rustorb-xtypes.workspace = true
rustorb-typesupport.workspace = true
rustorb-dds-security = { workspace = true, optional = true }

[features]
default = ["shm"]
# The shared memory transport between participants of one host.
shm = ["rustorb-rtps/shm"]
# DDS Security 1.2: authentication, access control and cryptography with
# the builtin plugins (rustorb-dds-security, on RustCrypto).
security = ["dep:rustorb-dds-security"]

[dev-dependencies]
rustorb-typesupport.workspace = true

[lints]
workspace = true
