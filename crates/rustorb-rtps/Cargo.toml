[package]
name = "rustorb-rtps"
description = "DDSI-RTPS wire protocol (messages, discovery, writers and readers) for rustorb-dds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
rustorb-cdr.workspace = true
rustorb-typesupport.workspace = true
rustorb-xtypes.workspace = true
socket2.workspace = true

[target.'cfg(unix)'.dependencies]
memmap2 = { workspace = true, optional = true }

[features]
default = ["shm"]
# The shared memory transport between participants of one host (Unix).
shm = ["dep:memmap2"]

[lints]
workspace = true
